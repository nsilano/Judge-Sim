name: TestFlight

# Push a tag named testflight-<build number>, e.g. testflight-1, to upload that build.
on:
  push:
    tags:
      - "testflight-*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion)"
        required: true
        default: "1"

jobs:
  upload:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; missing=1; else echo "Found $name"; fi
          done
          exit $missing

      - name: Build number
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_NUMBER=${{ inputs.build_number }}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NUMBER=${GITHUB_REF_NAME#testflight-}" >> "$GITHUB_ENV"
          fi

      - name: Install App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          # Accept the key either as raw .p8 text or base64-encoded.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project JudgeSim.xcodeproj -scheme JudgeSim \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JudgeSim.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/JudgeSim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: "*.log"
