name: Build check

# macOS runners bill at 10x on private repos, so this only runs when asked:
# put "[check]" in a commit message, or start it by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[check]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 found on this runner. Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "::notice::Using $(xcodebuild -version | head -1) with iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project JudgeSim.xcodeproj -scheme JudgeSim \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            grep -E "error:" build.log | sed 's#^.*/JudgeSim/##' | awk '!seen[$0]++' | head -20 \
              | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          fi
          echo "BUILD SUCCEEDED"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
