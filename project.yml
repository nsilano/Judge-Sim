# Fallback: if JudgeSim.xcodeproj won't open in your Xcode version,
# install XcodeGen (`brew install xcodegen`) and run `xcodegen` in this folder.
name: JudgeSim
options:
  bundleIdPrefix: com.nsilano
  deploymentTarget:
    iOS: "17.0"
targets:
  JudgeSim:
    type: application
    platform: iOS
    sources: [JudgeSim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsilano.judgesim
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Judge Sim
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 3
